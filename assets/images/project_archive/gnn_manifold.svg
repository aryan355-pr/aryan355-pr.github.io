<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#060c14"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#43cea2"/>
      <stop offset="100%" stop-color="#2a9d7c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#43cea2"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle Coordinate Grid -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" stroke-dasharray="4,4"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke-dasharray="4,4"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke-dasharray="4,4"/>
    <line x1="0" y1="320" x2="800" y2="320" stroke-dasharray="4,4"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke-dasharray="4,4"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke-dasharray="4,4"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke-dasharray="4,4"/>
  </g>

  <!-- Left: 1D Circular Topological Ring -->
  <g transform="translate(220, 200)">
    <!-- Base Ring -->
    <circle r="120" fill="none" stroke="#1e293b" stroke-width="18"/>
    <circle r="120" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2"/>
    
    <!-- Active $13^\circ$ Receptive Field Window Arc ($k=2$) -->
    <path d="M 0 -120 A 120 120 0 0 1 54.4 -107" fill="none" stroke="#43cea2" stroke-width="6" filter="url(#glow)"/>

    <!-- Degree markers -->
    <text x="0" y="-132" fill="#94a3b8" font-size="10" font-family="'Source Code Pro', monospace" text-anchor="middle">0° / 360°</text>
    <text x="135" y="4" fill="#94a3b8" font-size="10" font-family="'Source Code Pro', monospace" text-anchor="start">90°</text>
    <text x="0" y="142" fill="#94a3b8" font-size="10" font-family="'Source Code Pro', monospace" text-anchor="middle">180°</text>
    <text x="-135" y="4" fill="#94a3b8" font-size="10" font-family="'Source Code Pro', monospace" text-anchor="end">270°</text>

    <!-- Ring Nodes -->
    <!-- Node 1 (0 deg) -->
    <circle cx="0" cy="-120" r="7" fill="#43cea2" filter="url(#glow)"/>
    <text x="0" y="-105" fill="#e2e8f0" font-size="9" font-family="'Source Code Pro', monospace" font-weight="700" text-anchor="middle">v₀</text>

    <!-- Node 2 (26 deg) -->
    <circle cx="52.6" cy="-107.8" r="6" fill="#38bdf8"/>
    <!-- Node 3 (52 deg) -->
    <circle cx="94.5" cy="-73.8" r="5" fill="#334155"/>
    <!-- Node 4 (90 deg) -->
    <circle cx="120" cy="0" r="6" fill="#38bdf8"/>
    <!-- Node 5 (135 deg) -->
    <circle cx="84.8" cy="84.8" r="5" fill="#334155"/>
    <!-- Node 6 (180 deg) -->
    <circle cx="0" cy="120" r="6" fill="#38bdf8"/>
    <!-- Node 7 (225 deg) -->
    <circle cx="-84.8" cy="84.8" r="5" fill="#334155"/>
    <!-- Node 8 (270 deg) -->
    <circle cx="-120" cy="0" r="6" fill="#38bdf8"/>
    <!-- Node 9 (315 deg) -->
    <circle cx="-84.8" cy="-84.8" r="5" fill="#334155"/>

    <!-- Center Label -->
    <text x="0" y="-12" fill="#f8fafc" font-size="13" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">G = (V, E)</text>
    <text x="0" y="8" fill="#43cea2" font-size="10" font-family="'Source Code Pro', monospace" font-weight="600" text-anchor="middle">1D Closed Manifold</text>
    <text x="0" y="24" fill="#94a3b8" font-size="9" font-family="'Source Code Pro', monospace" text-anchor="middle">N = 360 Nodes</text>

    <!-- Arc Callout Tag -->
    <line x1="28" y1="-114" x2="65" y2="-145" stroke="#43cea2" stroke-width="1.2" stroke-dasharray="2,2"/>
    <rect x="70" y="-158" width="105" height="24" rx="4" fill="#0f172a" stroke="#43cea2" stroke-width="1"/>
    <text x="122" y="-142" fill="#43cea2" font-size="9" font-family="'Source Code Pro', monospace" font-weight="600" text-anchor="middle">k=2 (13° Window)</text>
  </g>

  <!-- Right: Unrolled Continuous Regression Graph -->
  <g transform="translate(460, 60)">
    <!-- Header -->
    <text x="0" y="16" fill="#f8fafc" font-size="14" font-family="'Inter', sans-serif" font-weight="700">Continuous Thickness Profile y(θ)</text>
    <text x="0" y="34" fill="#94a3b8" font-size="10" font-family="'Inter', sans-serif">Preserving focal anatomical notches without variance collapse</text>

    <!-- Plot Frame -->
    <rect x="0" y="50" width="300" height="200" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Plot Grid lines -->
    <line x1="0" y1="100" x2="300" y2="100" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
    <line x1="0" y1="150" x2="300" y2="150" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
    <line x1="0" y1="200" x2="300" y2="200" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>

    <!-- Mean Population Flatline (Baseline Failure) -->
    <line x1="10" y1="150" x2="290" y2="150" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
    <text x="285" y="142" fill="#ef4444" font-size="8" font-family="'Source Code Pro', monospace" text-anchor="end">Flat Baseline (Collapse)</text>

    <!-- Continuous GNN Output Curve (Realistic RNFL Double-Hump Pattern with Glaucomatous Notch) -->
    <path d="M 10 170 C 40 80, 70 80, 100 130 C 120 160, 135 210, 150 215 C 165 210, 180 150, 205 110 C 235 70, 265 90, 290 165" 
          fill="none" stroke="url(#curveGrad)" stroke-width="3" filter="url(#subtleGlow)"/>

    <!-- Focal Notch Point Annotation -->
    <circle cx="150" cy="215" r="4.5" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
    <line x1="150" y1="215" x2="150" y2="235" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="150" y="246" fill="#fca5a5" font-size="8.5" font-family="'Source Code Pro', monospace" text-anchor="middle">Focal Notch (15°)</text>

    <!-- X Axis Labels -->
    <text x="10" y="265" fill="#64748b" font-size="9" font-family="'Source Code Pro', monospace">0°</text>
    <text x="75" y="265" fill="#64748b" font-size="9" font-family="'Source Code Pro', monospace">90°</text>
    <text x="150" y="265" fill="#64748b" font-size="9" font-family="'Source Code Pro', monospace">180°</text>
    <text x="225" y="265" fill="#64748b" font-size="9" font-family="'Source Code Pro', monospace">270°</text>
    <text x="290" y="265" fill="#64748b" font-size="9" font-family="'Source Code Pro', monospace" text-anchor="end">360°</text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(30, 26)">
    <rect width="180" height="26" rx="13" fill="rgba(67, 206, 162, 0.12)" stroke="rgba(67, 206, 162, 0.35)" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#43cea2"/>
    <text x="26" y="17" fill="#43cea2" font-size="10" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="0.5">GEOMETRIC DEEP LEARNING</text>
  </g>
</svg>
